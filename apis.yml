aid: uniform
name: Uniform
description: >-
  Uniform (Uniform Systems, Inc.) is a visual workspace and composable digital
  experience platform (DXP) that lets marketing and engineering teams compose
  content, commerce, and data from 70+ integrated sources — headless CMSes,
  commerce engines, DAMs, search, CDNs — into personalized, A/B-tested digital
  experiences without glue code. The Uniform Platform API (REST under /api/v1
  and /api/v2 on uniform.app, with an EU data center at eu.uniform.app)
  manages compositions (Canvas), entries and content types, components,
  assets, releases, project maps, redirects, webhooks, integrations, roles and
  teams, and the classification/personalization surfaces (signals, quirks,
  tests, aggregates). Uniform ships 100+ npm packages under @uniformdev
  (framework SDKs for React, Next.js, Vue, Nuxt), a CLI, Svix-signed webhooks,
  an official hosted MCP server, and a published AI-rules library for LLM
  assistants. Recognized as a Visionary in the 2025 Gartner Magic Quadrant for
  Digital Experience Platforms; backed by Insight Partners.
url: https://raw.githubusercontent.com/api-evangelist/uniform/refs/heads/main/apis.yml
