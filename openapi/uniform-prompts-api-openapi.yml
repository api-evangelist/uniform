openapi: 3.2.0
info:
  title: Uniform Platform Prompts API
  version: '2.0'
tags:
- name: Prompts
paths:
  /api/v1/prompts:
    get:
      deprecated: true
      tags:
      - Prompts
      parameters:
      - in: query
        name: promptId
        schema:
          type: string
          format: uuid
      - in: query
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Prompt'
                - type: array
                  items:
                    $ref: '#/components/schemas/Prompt'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get api prompts
      x-summary-source: derived
      operationId: getApiV1Prompts
      x-operation-id-source: derived
    put:
      deprecated: true
      tags:
      - Prompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - projectId
              - data
              properties:
                data:
                  $ref: '#/components/schemas/Prompt'
                projectId:
                  type: string
                  format: uuid
              additionalProperties: false
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Replace api prompts
      x-summary-source: derived
      operationId: putApiV1Prompts
      x-operation-id-source: derived
    delete:
      deprecated: true
      tags:
      - Prompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - projectId
              - promptId
              properties:
                projectId:
                  type: string
                  format: uuid
                promptId:
                  type: string
                  format: uuid
              additionalProperties: false
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Delete api prompts
      x-summary-source: derived
      operationId: deleteApiV1Prompts
      x-operation-id-source: derived
components:
  responses:
    InternalServerError:
      description: Execution error occurred
    RateLimitError:
      description: Too many requests in allowed time period
    BadRequestError:
      description: Request input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: API key or token was not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Permission was denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Prompt:
      type: object
      description: AI Prompt definition
      required:
      - id
      - integrationType
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the prompt
        integrationType:
          type: string
          description: Unique identifier for the integration that this prompt belongs to
        name:
          type:
          - string
          - 'null'
          description: Name for the prompt
        text:
          type:
          - string
          - 'null'
          description: Text for the prompt
        data:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Data for the prompt
        enabled:
          type:
          - boolean
          - 'null'
          description: Turn off/on prompt
        builtIn:
          type:
          - boolean
          - 'null'
          description: Integration default prompt
        parameterTypes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Supported parameter types
    Error:
      type: object
      properties:
        errorMessage:
          description: Error message(s) that occurred while processing the request
          oneOf:
          - type: array
            items:
              type: string
          - type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
